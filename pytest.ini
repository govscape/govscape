[pytest]
# `tests/benchmarks` uses real (non-Dummy) embedding models over the full PDF
# sample corpus and is slow (~10 minutes), so it's excluded from the default
# run and the main CI `test` job. Run it explicitly (`pytest tests/benchmarks`,
# optionally with `--codspeed`) -- see CONTRIBUTOR.md -> "Performance
# Benchmarks". An explicit path argument still collects it despite this
# --ignore, since explicit paths take precedence.
addopts = --mypy --ignore=tests/benchmarks
filterwarnings =
    ignore::PendingDeprecationWarning

    # The combination of pylucene 10.0.0 and python 3.11.14 likes to emit warnings.
    # These warnings do not affect functionality, but they do pollute the test output.
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
testpaths = tests
junit_family=xunit2
xfail_strict=true
