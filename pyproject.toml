# src/pyproject.toml
[tool.poetry]
name = "govscape"
version = "0.1.0"
description = ""
authors = ["kylebd99 <kdeeds@bu.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <=3.14"
argparse = "^1.4.0"
boto3 = "^1.44"
botocore = {extras = ["crt"], version = "^1.44"}
duckdb = "^2.0"
# FAISS's GPU build trains and fills IVF-PQ indexes on GPU index builders (it
# runs on CPU-only hosts too); it has x86_64 wheels for Python < 3.14 only, so
# elsewhere (e.g. aarch64 development machines) the CPU build.
faiss-cpu = { version = "^1.16", markers = "sys_platform != 'linux' or platform_machine != 'x86_64' or python_version >= '3.14'" }
faiss-gpu-cu12 = { version = "1.14.1.post1", markers = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'" }
flask = "^3.1"
flask-cors = "^6.0"
flask-restx = "^1.3"
gunicorn = "^27.0"
lancedb = ">=0.41,<1"
mypy = "^2.4"
npm = "^0.1.1"
numpy = ">=2.0,<3.0"
pandas = "^3.1"
pdf2image = "^1.17.0"
pdfplumber = ">=0.11.9,<1"
pre-commit = "^4.7"
pyarrow = ">=26"
pymupdf = "^2.1"
pynvml = "^13.0"
pypdfium2 = "^5.15"
pytest = "^9.2"
pytest-mypy = "^1.1"
reportlab = "^5.1"
s5cmd = "^0.3.3"
scipy = "^1.17"
sentence-transformers = "^6.3"
# On Linux, install the CUDA (cu130) torch/torchvision builds from the PyTorch
# index so GPU hosts (e.g. the aarch64 DGX Spark) get GPU support out of the box;
# the CUDA wheels still import and run CPU-only where no GPU is present. macOS /
# Windows have no CUDA wheels, so they fall back to the default (CPU) build.
# GPU presence is not expressible in dependency markers, so this keys on platform.
#
# Pinned to the newest torch that kernels-community/flash-attn2 publishes
# prebuilt kernels for (torch212-*); with a newer torch, Qwen3 silently falls
# back to SDPA attention. Check the repo's build/ directory before bumping.
torch = [
    { version = "2.12.1", source = "pytorch-cu130", markers = "sys_platform == 'linux'" },
    { version = "2.12.1", markers = "sys_platform != 'linux'" },
]
torchvision = [
    { version = "0.27.1", source = "pytorch-cu130", markers = "sys_platform == 'linux'" },
    { version = "0.27.1", markers = "sys_platform != 'linux'" },
]
transformers = "^5.24"
warcio = "^1.8"
whoosh = "^2.7.4"

# Optional OCR engine backends. Each implementation guards its import, so these
# are only required when the corresponding `ocr_type` is used. Install a backend
# with e.g. `poetry install --extras ocr` (all engines) or `--extras easyocr`.
# Note: the `ocrmypdf` backend also needs the Tesseract system binary, which is
# not a Python package (see the module README).
easyocr = { version = "^1.7.2", optional = true }
ocrmypdf = { version = "^17.14", optional = true }
olmocr = { version = "^0.4.27", optional = true }
opencv-python = { version = ">=4.11", optional = true }
pytesseract = { version = "^0.3.10", optional = true }
sentencepiece = "^0.2.3"
# sentencepiece's generated model code (used to load SigLIP's tokenizer) needs
# protobuf.runtime_version, which arrived in 5.26.
protobuf = ">=5.26"
lmdb = "^3.0.0"
requests = "^2.34.2"
# The range transformers accepts for hub kernels (e.g. FlashAttention for Qwen3).
kernels = ">=0.18.2,<0.19"
tantivy = ">=0.24,<1"

[tool.poetry.extras]
easyocr = ["opencv-python", "easyocr"]
olmocr = ["opencv-python", "olmocr"]
ocrmypdf = ["opencv-python", "ocrmypdf", "pytesseract"]
ocr = [
    "opencv-python",
    "easyocr",
    "olmocr",
    "ocrmypdf",
    "pytesseract",
]

[[tool.poetry.source]]
# Explicit priority: used only by packages that reference it (torch/torchvision),
# never for general dependency resolution.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "types-requests (>=2.32.4.20260107,<3.0.0.0)",
    "pandas-stubs (>=3.1,<4.0.0.0)",
    "types-flask-cors (>=6.0.0.20250809,<7.0.0.0)",
    "moto[server] (>=5.2,<6.0.0)",
    "pytest-codspeed (>=5.0.3,<6.0.0)",
    "pytest-regressions (>=2.11.0,<3.0.0)"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "YTT", "BLE", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "PGH", "FLY", "NPY", "PERF", "RUF022"]
ignore = ["PYI024", "BLE001"]

[tool.ruff.lint.isort.sections]
numpy = ["numpy", "numpy.*", "scipy", "scipy.*"]
pytest = ["pytest", "pytest.*"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "pytest",
    "numpy",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.mypy]
ignore_missing_imports = true
exclude = ["tests/reference", "src/finchlite/codegen/stc"]

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true
