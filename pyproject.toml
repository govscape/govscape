# src/pyproject.toml
[tool.poetry]
name = "govscape"
version = "0.1.0"
description = ""
authors = ["kylebd99 <kdeeds@bu.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <=3.14"
argparse = "^1.4.0"
awscli = "^1.42.66"
boto3 = "^1.39.4"
botocore = {extras = ["crt"], version = "^1.42.39"}
duckdb = "^1.4.4"
faiss-cpu = "1.11.0"
flask = "3.1.0"
flask-cors = "5.0.1"
flask-restx = "1.3.0"
gunicorn = "^23.0.0"
lancedb = "^0.25.2"
mypy = "^1.19.1"
npm = "^0.1.1"
numpy = ">=2.0,<3.0"
pandas = "^2.3.1"
pdf2image = "^1.17.0"
pdfplumber = "^0.11.5"
pre-commit = "^4.5.1"
pyarrow = "^21.0.0"
pymupdf = "^1.25.5"
pynvml = "^12.0.0"
pypdfium2 = "^4.30"
pytest = "^8.4.0"
pytest-mypy = "^1.0.1"
reportlab = "^4.4.1"
s5cmd = "^0.3.3"
scipy = "^1.13"
sentence-transformers = "^4.0.1"
# On Linux, install the CUDA (cu130) torch/torchvision builds from the PyTorch
# index so GPU hosts (e.g. the aarch64 DGX Spark) get GPU support out of the box;
# the CUDA wheels still import and run CPU-only where no GPU is present. macOS /
# Windows have no CUDA wheels, so they fall back to the default (CPU) build.
# GPU presence is not expressible in dependency markers, so this keys on platform.
torch = [
    { version = "2.10.0", source = "pytorch-cu130", markers = "sys_platform == 'linux'" },
    { version = "2.10.0", markers = "sys_platform != 'linux'" },
]
torchvision = [
    { version = "0.25.0", source = "pytorch-cu130", markers = "sys_platform == 'linux'" },
    { version = "0.25.0", markers = "sys_platform != 'linux'" },
]
transformers = "4.55.2"
warcio = "^1.7.5"
whoosh = "^2.7.4"

# Optional OCR engine backends. Each implementation guards its import, so these
# are only required when the corresponding `ocr_type` is used. Install a backend
# with e.g. `poetry install --extras ocr` (all engines) or `--extras easyocr`.
# Note: the `ocrmypdf` backend also needs the Tesseract system binary, which is
# not a Python package (see the module README).
easyocr = { version = "^1.7.0", optional = true }
ocrmypdf = { version = "^16.0.0", optional = true }
olmocr = { version = "^0.4.27", optional = true }
opencv-python = { version = "^4.9.0", optional = true }
paddleocr = { version = "^2.7.0", optional = true }
paddlepaddle = { version = "^2.6.0", optional = true }
pytesseract = { version = "^0.3.10", optional = true }
setuptools = "^82.0.1"

[tool.poetry.extras]
easyocr = ["opencv-python", "easyocr"]
paddleocr = ["opencv-python", "paddleocr", "paddlepaddle"]
olmocr = ["opencv-python", "olmocr"]
ocrmypdf = ["opencv-python", "ocrmypdf", "pytesseract"]
ocr = [
    "opencv-python",
    "easyocr",
    "paddleocr",
    "paddlepaddle",
    "olmocr",
    "ocrmypdf",
    "pytesseract",
]

[[tool.poetry.source]]
# Explicit priority: used only by packages that reference it (torch/torchvision),
# never for general dependency resolution.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "types-requests (>=2.32.4.20260107,<3.0.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)",
    "types-flask-cors (>=6.0.0.20250809,<7.0.0.0)",
    "moto[server] (>=5.0.0,<6.0.0)",
    "ruff (>=0.16.2,<0.17.0)"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "YTT", "BLE", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "PGH", "FLY", "NPY", "PERF", "RUF022"]
ignore = ["PYI024", "BLE001"]

[tool.ruff.lint.isort.sections]
numpy = ["numpy", "numpy.*", "scipy", "scipy.*"]
pytest = ["pytest", "pytest.*"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "pytest",
    "numpy",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.mypy]
ignore_missing_imports = true
exclude = ["tests/reference", "src/finchlite/codegen/stc"]

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true
