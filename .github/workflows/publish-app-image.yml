name: Publish App Image

# Builds the API server image (./Dockerfile) that the OpenTofu-managed API
# instance runs (see infra/README.md). Deploy a build by setting app_image in
# infra/terraform.tfvars to its sha-* tag and running `tofu apply`.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'interface/**'
      - 'infra/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/govscape
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=GovScape
            org.opencontainers.image.description=GovScape API server image.

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
